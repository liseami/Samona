<!--
  [INPUT]: 无外部依赖，纯静态 HTML/CSS/JS，仅用系统字体族
  [OUTPUT]: 对外呈现 Samona 单页——中央一行在 20 国语言间轮换的标语
  [POS]: 项目唯一入口，Cloudflare Pages 直接托管的根文档
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Samona</title>
  <meta name="description" content="The only AI humanity will ever need." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='6' fill='white'/%3E%3C/svg%3E" />
  <style>
    /* ============ 基底：一片纯粹的黑 ============ */
    :root {
      --ink: #f5f5f4;
      --void: #0a0a0a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--ink);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      /* 覆盖 20 国字形：拉丁 / CJK / 阿拉伯 / 泰文 / 天城文 等交由系统字体优雅回退 */
      font-family: -apple-system, "Helvetica Neue", "Segoe UI", "PingFang SC",
                   "Hiragino Sans", "Noto Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ============ 中央那一行会呼吸的文字 ============ */
    #line {
      padding: 0 8vw;
      max-width: 40ch;
      text-align: center;
      font-size: clamp(1.35rem, 4.5vw, 2.6rem);
      font-weight: 300;
      line-height: 1.35;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 1.1s ease;
      will-change: opacity;
    }
    #line.show { opacity: 1; }

    /* ============ 角落一枚静默的签名 ============ */
    #mark {
      position: fixed;
      bottom: max(1.4rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--ink) 34%, transparent);
    }

    @media (prefers-reduced-motion: reduce) {
      #line { transition: opacity 0.01ms; }
    }
  </style>
</head>
<body>
  <main>
    <p id="line" aria-live="polite"></p>
    <p id="mark">Samona</p>
  </main>

  <script>
    // ============ 20 国语言 · 同一句话 ============
    // 每条记录：{ 文本, 语言标签, 文字方向 }。lang 交给浏览器选形，dir 处理阿拉伯语从右向左。
    const LINES = [
      { t: "The only AI humanity will ever need.",            lang: "en" },
      { t: "人类唯一需要的 AI。",                              lang: "zh" },
      { t: "La única IA que la humanidad necesitará.",         lang: "es" },
      { t: "मानवता को जिस एकमात्र AI की ज़रूरत होगी।",          lang: "hi" },
      { t: "الذكاء الاصطناعي الوحيد الذي ستحتاجه البشرية.",     lang: "ar", dir: "rtl" },
      { t: "A única IA de que a humanidade precisará.",        lang: "pt" },
      { t: "Единственный ИИ, который понадобится человечеству.", lang: "ru" },
      { t: "人類が必要とする唯一のAI。",                        lang: "ja" },
      { t: "La seule IA dont l'humanité aura besoin.",         lang: "fr" },
      { t: "Die einzige KI, die die Menschheit je brauchen wird.", lang: "de" },
      { t: "인류에게 필요한 유일한 AI.",                        lang: "ko" },
      { t: "L'unica IA di cui l'umanità avrà bisogno.",        lang: "it" },
      { t: "İnsanlığın ihtiyaç duyacağı tek yapay zekâ.",      lang: "tr" },
      { t: "Trí tuệ nhân tạo duy nhất nhân loại cần.",         lang: "vi" },
      { t: "AI เดียวที่มนุษยชาติต้องการ",                       lang: "th" },
      { t: "Satu-satunya AI yang dibutuhkan umat manusia.",    lang: "id" },
      { t: "De enige AI die de mensheid ooit nodig heeft.",    lang: "nl" },
      { t: "Jedyna SI, jakiej ludzkość będzie potrzebować.",   lang: "pl" },
      { t: "Єдиний ШІ, який знадобиться людству.",             lang: "uk" },
      { t: "Η μόνη ΤΝ που θα χρειαστεί ποτέ η ανθρωπότητα.",    lang: "el" },
    ];

    const line = document.getElementById("line");
    const HOLD = 2600;   // 每句停留
    const FADE = 1100;   // 与 CSS transition 对齐
    let i = 0;

    function render(idx) {
      const item = LINES[idx];
      line.textContent = item.t;
      line.setAttribute("lang", item.lang);
      line.setAttribute("dir", item.dir || "ltr");
    }

    function cycle() {
      line.classList.remove("show");          // 淡出
      setTimeout(() => {
        i = (i + 1) % LINES.length;
        render(i);
        line.classList.add("show");           // 换语言后淡入
      }, FADE);
    }

    // 首帧：先渲染再点亮，避免闪现
    render(0);
    requestAnimationFrame(() => line.classList.add("show"));
    setInterval(cycle, HOLD + FADE);
  </script>
</body>
</html>
